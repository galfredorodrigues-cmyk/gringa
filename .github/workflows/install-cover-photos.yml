name: Install four licensed HER POV portrait photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-cover-photos.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download distinct commercial-use Unsplash photos and optimize locally
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<12"
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image, ImageOps
          mapping = {
            "vol-01": "1604445759020-96c93fa61557",
            "vol-02": "1726047336347-77803fc5f725",
            "vol-03": "1770363759358-d6faebd4c6ea",
            "vol-04": "1762342670289-d86a1902f0f3",
          }
          dst=Path("static/cover-photos")
          dst.mkdir(parents=True,exist_ok=True)
          for slug, image_id in mapping.items():
              url=f"https://images.unsplash.com/photo-{image_id}?auto=format&fit=crop&w=900&h=900&q=85"
              req=Request(url,headers={"User-Agent":"HER-POV/1.0"})
              with urlopen(req,timeout=40) as response:
                  raw=response.read(6_000_001)
              if len(raw)>6_000_000:
                  raise ValueError("unexpectedly large photo")
              with Image.open(BytesIO(raw)) as image:
                  if image.width<350 or image.height<350:
                      raise ValueError("low resolution source image: "+slug)
                  photo=ImageOps.fit(image.convert("RGB"),(900,900),method=Image.Resampling.LANCZOS)
                  photo.save(dst/(slug+".jpg"),format="JPEG",quality=84,optimize=True,progressive=True)
              print(slug,"ready", (dst/(slug+".jpg")).stat().st_size)
          PY
      - name: Save photo assets in this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/cover-photos/
          if git diff --cached --quiet; then
            echo "Photo assets already current."
          else
            git commit -m "Install four locally hosted differentiated HER POV cover portraits"
            git push origin HEAD:main
          fi
