name: HER POV public preview smoke
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify storefront health and safety gate
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          base="https://her-pov-preview.onrender.com"
          def req(path, method="GET", body=None, headers=None, expected=200):
              last=None
              for attempt in range(5):
                  try:
                      request=urllib.request.Request(base+path,data=body,method=method,headers=headers or {})
                      with urllib.request.urlopen(request,timeout=40) as response:
                          status=response.status
                          contents=response.read()
                  except urllib.error.HTTPError as error:
                      status=error.code
                      contents=error.read()
                  except Exception as error:
                      last=error
                      if attempt < 4:
                          time.sleep(12)
                          continue
                      raise AssertionError(f"Could not reach {path}: {error!r}")
                  assert status==expected, f"{path}: wanted {expected}, got {status}; body {contents[:160]!r}"
                  return contents
              raise AssertionError(str(last))
          body=req("/")
          assert b"CHECKOUT OPENING SOON" in body, "Checkout prelaunch gate missing"
          text_body=body.replace(b"<br>", b" ").replace(b"<br/>", b" ").replace(b"<br />", b" ")
          for keyword in [b"You had something to say", b"The First Message Formula",
                          b"The Reply Decoder", b"The Profile Makeover",
                          b"From Chat to", b"AI Coach", b"C.A.R.E.",
                          b"$9.90", b"First Message Cheat Sheet", b"GUIDE COMPLETE", b"$29.90", b"SAVE $12.70", b"BUNDLE CHECKOUT OPENING SOON"]:
              assert keyword.lower() in text_body.lower(), f"Missing content: {keyword!r}"
          for excerpt in [b"READ BEFORE YOU BUY",b"PDF PAGE 13 OF 56",
                          b"PDF PAGE 6 OF 19",b"PDF PAGE 7 OF 19",
                          b"PDF PAGE 5 OF 19",b"The S.I.G.N.A.L. Check",
                          b"The C.L.E.A.R. Invitation",b"$24.90",
                          b"PROPOSED PRICE",b"NOT AVAILABLE FOR PURCHASE"]:
              assert excerpt in body, f"Missing real sample or future app pricing: {excerpt!r}"
          assert body.count(b'class="sample-card"')==4, "Expected four real excerpt samples"
          # US-English sales copy: concrete promise, scannable benefits, accurate FAQs
          for phrase in [b"Four real-world skills.",b"One complete library.",
                         b"24 common texting scenarios",b"Know what you get.",
                         b"Can I start with just one guide?"]:
              assert phrase in body, f"US copy proofing phrase missing: {phrase!r}"
          first_fold=body.split(b'<section class="hero section-dark"')[1].split(b'</section>')[0]
          assert b"$29.90" not in first_fold and b"$9.90" not in first_fold, "First fold should be benefit-led"
          assert b"START WITH A BETTER MESSAGE" in first_fold
          assert b"SEE A REAL EXAMPLE" in first_fold
          assert body.index(b'id="starter-choice"') < body.index(b'id="complete-choice"'), "Starter must be first"
          assert body.index(b'id="offer"') < body.index(b'id="bundle"'), "Bundle longform must follow starter"
          assert b"A PRACTICAL TIP YOU CAN USE RIGHT NOW" in body
          assert b"Do I need to memorize pickup lines?" in body
          assert b"not a stock mockup or an invented testimonial" not in body
          assert b"https://buy.stripe.com/" not in body, "Live payment link must remain unlisted"
          css=req("/static/css/landing.css")
          assert len(css)>15000 and b".hero__grid" in css and b"@media" in css, "Responsive style missing"
          assert b"prefers-reduced-motion" in css and b".sample-paper" in css, "A11y motion or sample styling missing"
          status=json.loads(req("/health"))
          assert status["checkout_enabled"] is False, "Do not enable production checkout"
          req("/success?session_id=cs_test_invalid",expected=403)
          req("/download?sid=cs_test_invalid&kind=ebook&exp=0&sig=x",expected=403)
          for path, marker in [
              ("/terms",b"Terms of Purchase"),
              ("/privacy",b"Privacy Notice"),
              ("/refunds",b"Refunds &amp; Digital Delivery"),
              ("/contact",b"Contact &amp; Order Support"),
          ]:
              legal=req(path)
              assert marker in legal, f"{path}: missing title"
              assert b"Pre-launch policy notice" in legal, f"{path}: false legal approval"
              assert b"Merchant" in legal or b"merchant" in legal, f"{path}: merchant info missing"
          import struct, hashlib
          art = {}
          for slug in ["first-message-formula", "reply-decoder", "profile-makeover",
                       "from-chat-to-first-date", "complete-library"]:
              path="/product-art/"+slug+".png"
              image=req(path)
              assert image[:8]==bytes.fromhex("89504e470d0a1a0a"), f"{slug}: not a valid PNG"
              assert len(image)>20000, f"{slug}: unexpectedly small image"
              width,height=struct.unpack(">II",image[16:24])
              assert (width,height)==(1000,1000), f"{slug}: unexpected dimensions"
              art[slug]=hashlib.sha256(image).hexdigest()
          assert len(set(art.values()))==5, "Two Stripe product covers are identical"
          print("PASS: all five public Stripe product PNG images deliver unique 1000x1000 files")
          # Public source-page previews must be genuine XML from four single pages.
          for slug in ["first-message-formula","reply-decoder",
                       "profile-makeover","from-chat-to-first-date"]:
              svg=req("/sample-page/"+slug+".svg")
              assert svg.startswith(b'<svg xmlns="http://www.w3.org/2000/svg"'), f"{slug}: SVG not served"
              assert b"HER POV" in svg and b"<text" in svg, f"{slug}: missing source text"
              assert b"%PDF-" not in svg, f"{slug}: private PDF data exposed"
          req("/sample-page/unknown.svg",expected=404)
          req("/admin/assets",expected=401)
          req("/admin/setup",expected=401)
          req("/admin/test-email",method="POST",body=b"{}",expected=401)
          req("/webhook/stripe",method="POST",body=b"{}",headers={"Stripe-Signature":"t=0,v1=bad","Content-Type":"application/json"},expected=400)
          print("PASS: new English funnel, five-product roadmap, responsive CSS, checkout closed, private access and invalid webhook rejected.")
          PY
