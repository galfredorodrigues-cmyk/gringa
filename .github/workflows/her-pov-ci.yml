name: HER POV secure checkout tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py commerce.py private_storage.py tests
      - name: Run local checkout and delivery tests
        run: python -m unittest discover -s tests -v
